# Model Morph 插件独立 ruff 配置。
# 阻断向上查找父目录（AstrBot 主仓库）的 pyproject.toml —— 该文件引用了本机
# ruff 0.9.2 不支持的规则选择器（ASYNC240），会导致 ruff 解析失败。
# 参数对齐既有代码风格：父配置 line-length 88 / 文件均为 LF 行尾。

target-version = "py312"
line-length = 88

[lint]
# 插件代码惯用「异常兜底」风格（调度器绝不阻断消息流），保持默认规则集
# （E4/E7/E9/F），与 --isolated 行为一致；已有 noqa 注释不受影响。
select = ["E4", "E7", "E9", "F"]

[format]
line-ending = "lf"
